name: CI

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Statisk sjekk
        run: node scripts/check.mjs
      - name: Installer Playwright
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Røyktester
        run: npx playwright test
        env:
          # Valgfritt: egen testbruker for innlogget kontrastsjekk (Settings → Secrets).
          MV_TEST_USER: ${{ secrets.MV_TEST_USER }}
          MV_TEST_PASSWORD: ${{ secrets.MV_TEST_PASSWORD }}
      - name: Last opp rapport ved feil
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
